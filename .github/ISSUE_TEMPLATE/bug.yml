name: Bug Report
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `darwin ...`
        2. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Darwin version
      placeholder: "output of `darwin --version`"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Active provider (if applicable)
      options:
        - openai-compatible
        - anthropic
        - deepseek
        - qwen
        - glm
        - moonshot
        - minimax
        - not configured
        - other (specify in repro)
      description: |
        Run `darwin config list` and look at the active provider.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: |
        Paste from `~/.darwin/logs/` or stderr. Redact API keys
        before pasting.
      render: shell
    validations:
      required: false
