<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darwin</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --err: #f87171;
      --panel: #1e293b;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .version { color: var(--muted); font-size: 0.875rem; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .msg { margin: 0.75rem 0; padding: 0.75rem 1rem; border-radius: 0.5rem; }
    .msg.user { background: var(--accent); color: #0c1929; align-self: flex-end; max-width: 80%; margin-left: auto; }
    .msg.assistant { background: var(--panel); max-width: 80%; }
    .msg.error { background: #7f1d1d; color: var(--err); }
    .msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
    form {
      padding: 1rem 1.5rem;
      border-top: 1px solid #334155;
      display: flex;
      gap: 0.5rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    textarea {
      flex: 1;
      background: var(--panel);
      color: var(--fg);
      border: 1px solid #334155;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      font: inherit;
      resize: vertical;
      min-height: 2.5rem;
      max-height: 8rem;
    }
    button {
      background: var(--accent);
      color: #0c1929;
      border: 0;
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 0.875rem; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>Darwin</h1>
    <span class="version" id="version">v...</span>
  </header>
  <main id="messages">
    <div class="hint">Ask Darwin anything. Set your provider with <code>darwin config add</code> on the host first.</div>
  </main>
  <form id="form">
    <textarea id="input" placeholder="Message Darwin..." autofocus required></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const messages = document.getElementById('messages');
    const versionEl = document.getElementById('version');

    function append(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const pre = document.createElement('pre');
      pre.textContent = text;
      div.appendChild(pre);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function loadVersion() {
      try {
        const r = await fetch('/api/health');
        const j = await r.json();
        versionEl.textContent = 'v' + j.version;
      } catch {
        versionEl.textContent = 'unknown';
      }
    }

    async function sendMessage(message) {
      append('user', message);
      const placeholder = document.createElement('div');
      placeholder.className = 'msg assistant';
      placeholder.textContent = '...';
      messages.appendChild(placeholder);
      messages.scrollTop = messages.scrollHeight;
      send.disabled = true;
      input.disabled = true;
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const j = await r.json();
        placeholder.remove();
        if (r.ok) {
          append('assistant', j.reply || '(empty reply)');
        } else {
          append('error', j.error || 'HTTP ' + r.status);
        }
      } catch (e) {
        placeholder.remove();
        append('error', String(e));
      } finally {
        send.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      sendMessage(message);
    });

    // Enter to send, Shift+Enter for newline.
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    loadVersion();
  </script>
</body>
</html>
