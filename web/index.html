<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darwin</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --err: #f87171;
      --panel: #1e293b;
    }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .version { color: var(--muted); font-size: 0.875rem; }
    .status { color: var(--muted); font-size: 0.875rem; }
    .status.live { color: var(--accent); }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .msg { margin: 0.75rem 0; padding: 0.75rem 1rem; border-radius: 0.5rem; }
    .msg.user { background: var(--accent); color: #0c1929; align-self: flex-end; max-width: 80%; margin-left: auto; }
    .msg.assistant { background: var(--panel); max-width: 80%; }
    .msg.error { background: #7f1d1d; color: var(--err); }
    .msg pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; }
    /* V32: blinking caret while the assistant is streaming. */
    .caret::after {
      content: '\2588';
      display: inline-block;
      color: var(--accent);
      margin-left: 1px;
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    form {
      padding: 1rem 1.5rem;
      border-top: 1px solid #334155;
      display: flex;
      gap: 0.5rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    textarea, input[type="password"] {
      flex: 1;
      background: var(--panel);
      color: var(--fg);
      border: 1px solid #334155;
      border-radius: 0.375rem;
      padding: 0.5rem 0.75rem;
      font: inherit;
      resize: vertical;
      min-height: 2.5rem;
      max-height: 8rem;
    }
    input[type="password"] { min-height: 2.5rem; resize: none; }
    button {
      background: var(--accent);
      color: #0c1929;
      border: 0;
      border-radius: 0.375rem;
      padding: 0.5rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--panel); color: var(--fg); border: 1px solid #334155; }
    .hint { color: var(--muted); font-size: 0.875rem; text-align: center; padding: 2rem; }
    /* V34: login overlay covers main until the user provides a valid token. */
    .login-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      background: var(--panel);
      padding: 1.5rem 2rem;
      border-radius: 0.75rem;
      max-width: 480px;
      width: 100%;
      border: 1px solid #334155;
    }
    .login-card h2 { margin: 0 0 0.5rem 0; font-size: 1.125rem; }
    .login-card p { color: var(--muted); margin: 0 0 1rem 0; font-size: 0.875rem; }
    .login-card form { padding: 0; border: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .login-card .err { color: var(--err); font-size: 0.875rem; min-height: 1.25em; }
  </style>
</head>
<body>
  <header>
    <h1>Darwin</h1>
    <div>
      <span class="status" id="status">connecting</span>
      <span class="version" id="version">v...</span>
      <button type="button" id="logout" class="secondary" hidden>Sign out</button>
    </div>
  </header>
  <main id="messages" hidden>
    <div class="hint">Ask Darwin anything. Set your provider with <code>darwin config add</code> on the host first.</div>
  </main>
  <form id="form" hidden>
    <button type="button" id="stop" class="secondary" hidden>Stop</button>
    <textarea id="input" placeholder="Message Darwin..." autofocus required></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <div class="login-wrap" id="loginWrap" hidden>
    <div class="login-card">
      <h2>Sign in</h2>
      <p>Enter the auth token printed by <code>darwin web</code> on the host. The token is stored in this browser's localStorage only.</p>
      <form id="loginForm">
        <input type="password" id="token" autocomplete="off" required placeholder="paste token">
        <div class="err" id="loginErr"></div>
        <button type="submit" id="loginBtn">Sign in</button>
      </form>
    </div>
  </div>
  <script>
    // V34: auth flow + V32 streaming chat. The page boots by calling
    // /api/health to discover whether the server requires auth. If
    // auth_required is true, we look for a token in localStorage
    // (or capture ?token=... from the URL) and either enter the
    // chat or render the login card. Every protected fetch goes
    // through authedFetch(), which injects the Authorization header
    // and reacts to 401 by clearing the token and bouncing back to
    // the login screen.
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const stop = document.getElementById('stop');
    const messages = document.getElementById('messages');
    const versionEl = document.getElementById('version');
    const statusEl = document.getElementById('status');
    const logoutBtn = document.getElementById('logout');
    const loginWrap = document.getElementById('loginWrap');
    const loginForm = document.getElementById('loginForm');
    const tokenInput = document.getElementById('token');
    const loginErr = document.getElementById('loginErr');
    const loginBtn = document.getElementById('loginBtn');

    const TOKEN_KEY = 'darwin.authToken';

    let activeStream = null; // AbortController for the in-flight request
    let authRequired = false; // discovered from /api/health on boot
    let authToken = null; // current bearer token (mirrors localStorage)

    function readToken() {
      try {
        return localStorage.getItem(TOKEN_KEY);
      } catch (_) {
        return null;
      }
    }
    function writeToken(t) {
      try {
        localStorage.setItem(TOKEN_KEY, t);
      } catch (_) {
        /* ignore quota / private-mode */
      }
    }
    function clearToken() {
      try {
        localStorage.removeItem(TOKEN_KEY);
      } catch (_) {
        /* ignore */
      }
    }

    // V34: extract ?token= from the URL once on boot. If present,
    // we adopt it (saving the user from copy-paste) and strip the
    // query so it does not leak into browser history or shared
    // screenshots.
    function adoptTokenFromUrl() {
      const url = new URL(window.location.href);
      const t = url.searchParams.get('token');
      if (t && t.length > 0) {
        writeToken(t);
        url.searchParams.delete('token');
        const clean = url.pathname + (url.search ? url.search : '') + url.hash;
        window.history.replaceState({}, document.title, clean);
        return t;
      }
      return null;
    }

    function setStatus(text, live) {
      statusEl.textContent = text;
      statusEl.classList.toggle('live', !!live);
    }

    function showLogin(errMsg) {
      authToken = null;
      clearToken();
      logoutBtn.hidden = true;
      form.hidden = true;
      messages.hidden = true;
      loginWrap.hidden = false;
      loginErr.textContent = errMsg || '';
      tokenInput.value = '';
      tokenInput.focus();
    }

    function showChat() {
      logoutBtn.hidden = false;
      form.hidden = false;
      messages.hidden = false;
      loginWrap.hidden = true;
      setStatus('idle', false);
      input.focus();
    }

    // V34: a fetch wrapper that injects the bearer token when auth
    // is required. It also detects 401 and bounces back to the
    // login screen, so a stale token does not leave the user stuck.
    async function authedFetch(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (authRequired && authToken) {
        headers['Authorization'] = 'Bearer ' + authToken;
      }
      const r = await fetch(path, { ...opts, headers });
      if (authRequired && r.status === 401) {
        showLogin('token rejected -- paste the new one');
        throw new Error('auth failed');
      }
      return r;
    }

    function append(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      const pre = document.createElement('pre');
      pre.textContent = text;
      div.appendChild(pre);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return pre;
    }

    function appendStreaming() {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      const pre = document.createElement('pre');
      pre.classList.add('caret');
      div.appendChild(pre);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return {
        append(text) {
          pre.textContent += text;
          messages.scrollTop = messages.scrollHeight;
        },
        finish() {
          pre.classList.remove('caret');
          messages.scrollTop = messages.scrollHeight;
        },
        fail(errText) {
          pre.classList.remove('caret');
          div.className = 'msg error';
          pre.textContent = 'x ' + errText;
          messages.scrollTop = messages.scrollHeight;
        },
      };
    }

    async function loadVersion() {
      try {
        const r = await authedFetch('/api/health');
        const j = await r.json();
        versionEl.textContent = 'v' + j.version;
        authRequired = !!j.auth_required;
      } catch {
        versionEl.textContent = 'unknown';
      }
    }

    // Parse an SSE byte stream into { type: 'chunk'|'done'|'error', ... }
    // objects. The server's frame shape is:
    //   data: {"type":"chunk","text":"..."}\\n\\n
    //   data: {"type":"done"}\\n\\n
    //   data: {"type":"error","error":"..."}\\n\\n
    function parseSseStream(body) {
      const reader = body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const queue = [];
      let resolveNext = null;
      const pump = () =>
        reader.read().then(({ value, done }) => {
          if (done) {
            if (buffer.trim()) {
              const frame = parseFrame(buffer);
              if (frame) queue.push(frame);
            }
            queue.push({ type: '__done__' });
            if (resolveNext) {
              resolveNext();
              resolveNext = null;
            }
            return;
          }
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\\n\\n')) !== -1) {
            const block = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            const frame = parseFrame(block);
            if (frame) queue.push(frame);
          }
          if (resolveNext) {
            resolveNext();
            resolveNext = null;
          }
        });
      pump().catch((e) => {
        queue.push({ type: 'error', error: String(e) });
        queue.push({ type: '__done__' });
        if (resolveNext) {
          resolveNext();
          resolveNext = null;
        }
      });
      return {
        async next() {
          if (queue.length > 0) return queue.shift();
          return new Promise((res) => {
            resolveNext = () => res(queue.shift());
          });
        },
      };
    }

    function parseFrame(block) {
      const line = block.split('\\n').find((l) => l.startsWith('data: '));
      if (!line) return null;
      try {
        return JSON.parse(line.slice('data: '.length));
      } catch {
        return null;
      }
    }

    async function sendMessage(message) {
      append('user', message);
      const stream = appendStreaming();
      const ac = new AbortController();
      activeStream = ac;
      stop.hidden = false;
      send.disabled = true;
      input.disabled = true;
      setStatus('streaming', true);
      let finished = false;
      try {
        const r = await authedFetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'text/event-stream',
          },
          body: JSON.stringify({ message }),
          signal: ac.signal,
        });
        if (!r.ok) {
          let j;
          try {
            j = await r.json();
          } catch {
            j = { error: 'HTTP ' + r.status };
          }
          stream.fail(j.error || 'HTTP ' + r.status);
          return;
        }
        if (!r.body) {
          stream.fail('no response body');
          return;
        }
        const sse = parseSseStream(r.body);
        for (;;) {
          const frame = await sse.next();
          if (!frame || frame.type === '__done__') break;
          if (frame.type === 'chunk') {
            stream.append(frame.text || '');
          } else if (frame.type === 'done') {
            finished = true;
            break;
          } else if (frame.type === 'error') {
            stream.fail(frame.error || 'stream error');
            finished = true;
            break;
          }
        }
        if (!finished) stream.finish();
      } catch (e) {
        if (e && e.name === 'AbortError') {
          stream.finish();
        } else if (e && e.message === 'auth failed') {
          // authedFetch already routed us to the login screen.
          return;
        } else {
          stream.fail(String(e));
        }
      } finally {
        activeStream = null;
        stop.hidden = true;
        send.disabled = false;
        input.disabled = false;
        setStatus('idle', false);
        input.focus();
      }
    }

    function stopStream() {
      if (activeStream) {
        try {
          activeStream.abort();
        } catch {
          /* ignore */
        }
      }
    }

    // --- V34: boot flow -------------------------------------------------

    async function boot() {
      setStatus('connecting', false);
      // 1. Capture ?token=... if the URL has one (one-shot link).
      const urlToken = adoptTokenFromUrl();
      if (urlToken) authToken = urlToken;
      // 2. Probe /api/health. /api/health is open even with auth on, so
      //    this tells us whether the server wants a token without
      //    failing the boot on missing creds.
      let health;
      try {
        const r = await fetch('/api/health');
        if (!r.ok) {
          showLogin('health check failed: HTTP ' + r.status);
          return;
        }
        health = await r.json();
      } catch (e) {
        showLogin('cannot reach the server: ' + String(e));
        return;
      }
      versionEl.textContent = 'v' + (health.version || '?');
      authRequired = !!health.auth_required;
      // 3. Branch on auth mode.
      if (!authRequired) {
        showChat();
        return;
      }
      // Auth required. Try stored token, else fall back to login card.
      if (!authToken) authToken = readToken();
      if (!authToken) {
        showLogin('');
        return;
      }
      // We have a candidate token. Verify it against a protected route
      // (POST /api/chat with an obviously-empty message returns 400 if
      // auth passes, 401 if it doesn't -- either is a clear signal).
      try {
        const r = await authedFetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: '' }),
        });
        if (r.status === 401) {
          showLogin('saved token rejected -- paste the new one');
          return;
        }
        // 400 means "empty message" -- auth passed, so we can enter.
        if (r.status === 400) {
          showChat();
          return;
        }
        // Anything else (500, 200, ...) we treat as "good enough" --
        // the server is up and we got past the auth gate.
        showChat();
      } catch (_) {
        showLogin('saved token rejected -- paste the new one');
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      sendMessage(message);
    });

    stop.addEventListener('click', () => {
      stopStream();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // V34: login form submit.
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const t = tokenInput.value.trim();
      if (!t) return;
      authToken = t;
      writeToken(t);
      loginErr.textContent = '';
      // Re-run boot to verify and enter the chat.
      boot();
    });

    // V34: Sign out -- clear the token and bounce to login.
    logoutBtn.addEventListener('click', () => {
      showLogin('');
    });

    boot();
  </script>
</body>
</html>
